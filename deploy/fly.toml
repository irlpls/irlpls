# Fly.io app for the hosted read-only MCP server. Not deployed. Deploy from the repo root:
#   fly launch --no-deploy --copy-config -c deploy/fly.toml --name irlpls-mcp   (once; the name must be free on Fly)
#   fly deploy . -c deploy/fly.toml --dockerfile deploy/Dockerfile
# Cost (docs.fly.io/about/pricing, read 2026-11-02): shared-cpu-1x 256 MB = $2.19 per 30 days if always on, billed per
# second while running; stopped machines bill rootfs only ($0.15/GB-month); shared IPv4 + IPv6 free; first 10
# certificates free. With auto-stop below, expect $0.50-2.50/month.
app = "irlpls-mcp"
primary_region = "iad"

[env]
  IRLPLS_MCP_READ_ONLY = "1"
  IRLPLS_CLIENT_IP_HEADER = "fly-client-ip"   # Fly's proxy sets it; the rate limiter keys on it (memory only)

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
