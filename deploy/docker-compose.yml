# Local run (needs Docker):  docker compose -f deploy/docker-compose.yml up --build
services:
  irlpls-mcp:
    build: {context: .., dockerfile: deploy/Dockerfile}
    ports: ["127.0.0.1:8765:8765"]   # localhost only
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    environment: {IRLPLS_MCP_READ_ONLY: "1"}
