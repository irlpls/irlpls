name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest jsonschema playwright cryptography && python -m playwright install --with-deps chromium
      - run: python build.py --public
        env:
          IRLPLS_NO_FETCH: "1"   # CI builds from the repo only; the daily rebuild fetches
      - name: card gate (duplicate ids, id/file match, promo keys, evidenced needs evidence)
        run: python tools/check_cards.py
      - run: pytest -q tests
      - name: cards validate against the Capture Card schema
        run: |
          python - <<'PY'
          import json, glob, jsonschema
          schema = json.load(open("schema/capture-card.schema.json"))
          keys = {"human","application","camera","time","location","content","corroboration"}
          for f in sorted(glob.glob("cards/*.json")):
              c = json.load(open(f))
              jsonschema.validate(c, schema)
              assert set(c["verification"]) == keys, f
          print("all cards valid")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: site JS parses
        run: |
          node --check site/match.js && node --check site/app.js
          python - <<'PY'
          import re, subprocess
          html = re.sub(r"<!--.*?-->", "", open("site/index.html").read(), flags=re.S)
          n = 0
          for attrs, body in re.findall(r"<script([^>]*)>(.*?)</script>", html, re.S):
              if "src=" in attrs or "json" in attrs or not body.strip():
                  continue
              open("/tmp/inline.js", "w").write(body)
              subprocess.run(["node", "--check", "/tmp/inline.js"], check=True)
              n += 1
          print("inline scripts parsed:", n)
          PY
